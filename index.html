<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🔐 Password Strength Analyzer</h1>

        <p class="subtitle">
            Analyze your password security
        </p>

        <div class="input-box">
            <input
                type="password"
                id="password"
                placeholder="Enter your password..."
            >

            <button onclick="togglePassword()">👁</button>
        </div>

        <div class="strength">
            <div id="strength-bar"></div>
        </div>

        <h2 id="strength-text">Enter a password</h2>

        <div class="requirements">

            <p id="length">❌ At least 8 characters</p>

            <p id="uppercase">❌ Contains uppercase letter</p>

            <p id="lowercase">❌ Contains lowercase letter</p>

            <p id="number">❌ Contains a number</p>

            <p id="special">❌ Contains special character</p>

        </div>

        <div class="recommendation">
            <h3>🛡️ Security Recommendation</h3>

            <p id="recommendation-text">
                Enter a password to receive security recommendations.
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
